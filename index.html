<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Luis Eduardo Gomez Sainz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #2c3e50;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        
        .cv-container {
            max-width: 1000px;
            width: 100%;
            background: white;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 35% 65%;
        }
        
        /* Columna izquierda - Información personal */
        .left-column {
            background: linear-gradient(135deg, #3498db 0%, #2c3e50 100%);
            color: white;
            padding: 30px 25px;
            position: relative;
        }
        
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid rgba(255, 255, 255, 0.3);
            margin: 0 auto 25px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1a2530;
        }
        
        .profile-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .title {
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 25px;
            color: #ecf0f1;
            font-weight: 300;
        }
        
        .contact-info {
            margin-bottom: 30px;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
        
        .contact-item i {
            margin-right: 12px;
            width: 20px;
            color: #3498db;
        }
        
        .contact-item a {
            color: white;
            text-decoration: none;
        }

        .section-title {
            color: white;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
            margin: 25px 0 15px;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Habilidades */
        .skill {
            margin-bottom: 15px;
        }
        
        .skill-name {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        
        /* Idiomas */
        .language {
            margin-bottom: 15px;
        }
        
        /* Columna derecha - Contenido principal */
        .right-column {
            padding: 35px 30px;
        }
        
        .right-section-title {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
            margin: 25px 0 15px;
            font-size: 1.3rem;
            text-transform: uppercase;
        }
        
        .right-section-title:first-child {
            margin-top: 0;
        }
        
        .about {
            line-height: 1.6;
            margin-bottom: 10px;
            text-align: justify;
        }
        
        /* Experiencia laboral */
        .experience {
            margin-bottom: 22px;
            position: relative;
            padding-left: 20px;
            border-left: 2px solid #3498db;
        }
        
        .company {
            font-weight: 700;
            color: #2c3e50;
            font-size: 1.1rem;
            margin-bottom: 3px;
        }
        
        .period {
            color: #3498db;
            font-size: 0.9rem;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .job-title {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        
        .achievements {
            list-style-type: none;
        }
        
        .achievements li {
            margin-bottom: 8px;
            position: relative;
            padding-left: 20px;
        }
        
        .achievements li:before {
            content: "•";
            color: #3498db;
            font-weight: bold;
            position: absolute;
            left: 0;
        }
        
        /* Educación */
        .education {
            margin-bottom: 20px;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .cv-container {
                grid-template-columns: 1fr;
            }
            
            .left-column, .right-column {
                padding: 25px 20px;
            }
        }
    </style>
</head>
